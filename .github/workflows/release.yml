name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --icon=assets/icon.ico --name "WindowsLaptopInspector" inspector.py

      - name: Prepare release notes from tag message
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > release-notes.md
          test -s release-notes.md || printf 'Windows Laptop Inspector %s' "${{ github.ref_name }}" > release-notes.md

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindowsLaptopInspector.exe
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
